/* --- Typography: Headers --- */
h1, h2, h3 {
  font-family: 'Times New Roman', Times, serif;
  font-weight: normal;
  color: #ffffff;
  margin-bottom: 0.6em;
}

h1 {

  border-bottom: 1px solid #333;
  padding-bottom: 10px;
}

  font-size: 32px;
  color: #ffffff;
  font-style: italic;
}

  color: #C5A059;
  font-family: 'Times New Roman', Times, serif;
  font-weight: bold;
}

a {
  color: #C5A059;
  text-decoration: none;
  border-bottom: 1px dotted #C5A059;
}

code {
  font-family: 'Courier New', Courier, monospace;
  background: #1a1a1a;
  color: #C5A059;
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid #333;
}

blockquote {
  border-left: 3px solid #C5A059;
  padding-left: 20px;
  font-family: 'Times New Roman', Times, serif;
  font-style: italic;
  color: #bbbbbb;
  background: transparent;
}

/* --- Layout &amp; Utilities --- */
.caption {
  font-size: 14px;

  display: block;
  width: 100%;
  height: 560px;
  border: 0;
}

/* --- Paragraph body text on content slides --- */

  line-height: 1.45;
  font-size: 22px;
  margin-top: 0.35em;
}

.embed-caption {

}
